---
name: Compilation Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.config.name }}, NO_SIMD=${{ matrix.no_simd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        no_simd: ["OFF", "ON"]
        config:
          - name: "Force C++"
            cmake_args: "-DDR_LIBS_FORCE_CXX=ON"
          - name: "Force C89"
            cmake_args: "-DDR_LIBS_FORCE_C89=ON"

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libsndfile1-dev libflac-dev libogg-dev libmpg123-dev

      - name: Setup compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure CMake
        run: >-
          cmake -B build
          -DDR_LIBS_BUILD_TESTS=ON
          -DDR_LIBS_NO_SIMD=${{ matrix.no_simd }}
          ${{ matrix.config.cmake_args }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

  windows:
    name: Windows (MSVC, ${{ matrix.config.name }}, NO_SIMD=${{ matrix.no_simd }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        no_simd: ["OFF", "ON"]
        config:
          - name: "C"
            cmake_args: "-DDR_LIBS_FORCE_CXX=OFF"
          - name: "Force C++"
            cmake_args: "-DDR_LIBS_FORCE_CXX=ON"

    steps:
      - uses: actions/checkout@v7

      - name: Download dependency sources
        shell: bash
        run: |
          download_dependency() {
            local name="$1"
            local url="$2"
            local sha256="$3"
            local archive="$RUNNER_TEMP/${url##*/}"

            curl --fail --location --retry 3 "$url" --output "$archive"
            echo "$sha256  $archive" | sha256sum --check

            mkdir -p "external/$name"
            # Use Git Bash's GNU tar, not Windows tar, for Unicode filenames.
            /usr/bin/tar --force-local -xf "$archive" -C "external/$name" --strip-components=1
          }

          download_dependency ogg \
            "https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.xz" \
            "c4d91be36fc8e54deae7575241e03f4211eb102afb3fc0775fbbc1b740016705"
          download_dependency flac \
            "https://downloads.xiph.org/releases/flac/flac-1.5.0.tar.xz" \
            "f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920"
          download_dependency libsndfile \
            "https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz" \
            "3799ca9924d3125038880367bf1468e53a1b7e3686a934f098b7e1d286cdb80e"
          download_dependency mpg123 \
            "https://www.mpg123.org/download/mpg123-1.33.3.tar.bz2" \
            "6a0c6472dd156e213c2068f40115ebbb73978c2d873e66bae2a250e2d2198d26"

      - name: Configure CMake
        run: >-
          cmake -B build -A x64
          -DDR_LIBS_BUILD_TESTS=ON
          -DDR_LIBS_USE_BUNDLED_DEPENDENCIES=ON
          -DDR_LIBS_NO_SIMD=${{ matrix.no_simd }}
          ${{ matrix.config.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel
